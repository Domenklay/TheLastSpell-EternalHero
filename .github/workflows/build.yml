name: Build Eternal Hero v0.15

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test progression and ascension engine
        run: dotnet run --project tests/EternalHero.Tests/EternalHero.Tests.csproj --configuration Release
      - name: Build BepInEx plugin
        run: dotnet build src/EternalHero.Plugin/EternalHero.Plugin.csproj --configuration Release
      - name: Check permanent perk and racial suppression integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          perk=Path('src/EternalHero.Plugin/GamePerks.cs').read_text()
          race=Path('src/EternalHero.Plugin/RacialPenaltyGuard.cs').read_text()
          plugin=Path('src/EternalHero.Plugin/Plugin.cs').read_text()
          assert 'IsUnlockedFromPlayableUnit' in perk
          assert 'Get(perk,"Unlocked")' in perk
          assert 'isNative: true' not in perk or 'true, false' in perk
          assert 'RuntimeState(' in perk and 'NeedsPermanentSync(' in perk
          assert 'Get(__instance, "UnitStatsController")' in race
          assert 'Get(__instance, "PlayableUnitStatsController")' not in race
          assert 'IsFromRace' in race and 'IsOurHero' in race
          assert 'GamePerks.NeedsPermanentSync(' in plugin
          print('Static integration invariants checked; runtime game smoke test still required')
          PY
      - name: Verify native skill source integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          skills=Path('src/EternalHero.Plugin/GameSkills.cs').read_text()
          assert 'TheLastStand.Database.ItemDatabase' in skills
          assert 'SkillsByLevel' in skills and 'AllItemsDefinitions' in skills
          assert 'PermanentVanillaSkills' in skills and 'NativeSkills' in skills
          assert 'SkillController' in skills and 'Refresh' in skills
          assert 'EternalGhostShot' not in skills
          print('Vanilla item source and slot-free native skill integration checked')
          PY
      - name: Prepare installable artifact
        shell: bash
        run: |
          mkdir -p package/BepInEx/plugins/EternalHero
          cp src/EternalHero.Plugin/bin/Release/netstandard2.0/EternalHero.Plugin.dll package/BepInEx/plugins/EternalHero/
          cp src/EternalHero.Core/bin/Release/netstandard2.0/EternalHero.Core.dll package/BepInEx/plugins/EternalHero/
          cp docs/INSTALL.md package/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: EternalHero-v0.15
          path: package/
          if-no-files-found: error
