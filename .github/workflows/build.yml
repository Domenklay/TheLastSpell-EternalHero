name: Build Eternal Hero v0.20

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test progression and ascension engine
        run: dotnet run --project tests/EternalHero.Tests/EternalHero.Tests.csproj --configuration Release
      - name: Build BepInEx plugin
        run: dotnet build src/EternalHero.Plugin/EternalHero.Plugin.csproj --configuration Release
      - name: Check permanent perk and racial suppression integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          perk=Path('src/EternalHero.Plugin/GamePerks.cs').read_text()
          race=Path('src/EternalHero.Plugin/RacialPenaltyGuard.cs').read_text()
          plugin=Path('src/EternalHero.Plugin/Plugin.cs').read_text()
          assert 'IsUnlockedFromPlayableUnit' in perk
          assert 'Get(perk,"Unlocked")' in perk
          assert 'isNative: true' not in perk or 'true, false' in perk
          assert 'RuntimeState(' in perk and 'NeedsPermanentSync(' in perk
          assert 'RegisterRealPerk(' in perk and '"TryAddPerk"' in perk
          assert 'TryUnlockForHero(' in perk and 'ExplainPerkState(' in perk
          assert 'CreateOffTreeController(' in perk
          assert 'BindingFlags.NonPublic | BindingFlags.Instance' in perk
          assert 'constructor params=' in perk
          ui=Path('src/EternalHero.Plugin/HeroScreen.cs').read_text()
          assert 'ApplyPersistentPerks' in ui and 'Выдача герою:' in ui
          assert 'Get(__instance, "UnitStatsController")' in race
          assert 'Get(__instance, "PlayableUnitStatsController")' not in race
          assert 'IsFromRace' in race and 'IsOurHero' in race
          assert 'GamePerks.NeedsPermanentSync(' in plugin
          print('Static integration invariants checked; runtime game smoke test still required')
          PY
      - name: Verify native skill source integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          skills=Path('src/EternalHero.Plugin/GameSkills.cs').read_text()
          assert 'TheLastStand.Database.ItemDatabase' in skills
          assert 'SkillsByLevel' in skills and 'AllItemsDefinitions' in skills
          assert 'PermanentVanillaSkills' in skills and 'NativeSkills' in skills
          assert 'SkillController' in skills and 'Refresh' in skills
          assert 'EternalGhostShot' not in skills
          assert 'DisabledVanillaSkills' in skills
          assert 'SetEnabled(' in skills
          assert 'TheLastStand.View.Skill.SkillView' in skills
          assert 'GetIconSprite' in skills
          assert 'InstallDamageAdapter(' in skills
          assert 'ResolveOwnedSkillDamage(' in skills
          assert 'GameBridge.Get(hero,"EquipmentSlots")' in skills
          assert 'GameBridge.Get(hero,"EquippedWeaponSetIndex")' in skills
          assert '"RightHand"' in skills
          assert 'GameBridge.Get(equipped,"BaseDamages")' in skills
          assert 'return new Vector2(18f,26f)' in skills
          assert 'ItemDamageBySkill' not in skills
          assert 'RepairZeroBaseDamageRange' in skills
          assert 'ComputeBaseDamageRange' in skills
          assert 'IsOurActiveNativeSkill' in skills
          assert 'GetSourceDamage' in skills
          assert 'new Vector2Int(lo,hi)' in skills
          assert 'LogInfo("Eternal Hero: zero damage repaired' in skills
          assert 'SkillContainer' in skills
          plugin=Path('src/EternalHero.Plugin/Plugin.cs').read_text()
          assert 'GameSkills.InstallDamageAdapter(harmony, Logger)' in plugin
          core=Path('src/EternalHero.Core/Progression.cs').read_text()
          assert '[DataMember] public List<string> DisabledVanillaSkills' in core
          screen=Path('src/EternalHero.Plugin/HeroScreen.cs').read_text()
          assert 'GameSkills.Icon(entry.Id)' in screen
          assert 'ОТКЛЮЧИТЬ' in screen and 'ВКЛЮЧИТЬ' in screen
          print('Vanilla item source and slot-free native skill integration checked')
          PY
      - name: Prepare installable artifact
        shell: bash
        run: |
          mkdir -p package/BepInEx/plugins/EternalHero
          cp src/EternalHero.Plugin/bin/Release/netstandard2.0/EternalHero.Plugin.dll package/BepInEx/plugins/EternalHero/
          cp src/EternalHero.Core/bin/Release/netstandard2.0/EternalHero.Core.dll package/BepInEx/plugins/EternalHero/
          cp docs/INSTALL.md package/INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: EternalHero-v0.20
          path: package/
          if-no-files-found: error
