name: Build Eternal Hero v0.14

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test progression and ascension engine
        run: dotnet run --project tests/EternalHero.Tests/EternalHero.Tests.csproj --configuration Release
      - name: Build BepInEx plugin
        run: dotnet build src/EternalHero.Plugin/EternalHero.Plugin.csproj --configuration Release
      - name: Check permanent perk and racial suppression integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          perk=Path('src/EternalHero.Plugin/GamePerks.cs').read_text()
          race=Path('src/EternalHero.Plugin/RacialPenaltyGuard.cs').read_text()
          plugin=Path('src/EternalHero.Plugin/Plugin.cs').read_text()
          assert 'IsUnlockedFromPlayableUnit' in perk
          assert 'Get(perk,"Unlocked")' in perk
          assert 'isNative: true' not in perk or 'true, false' in perk
          assert 'RuntimeState(' in perk and 'NeedsPermanentSync(' in perk
          assert 'Get(__instance, "UnitStatsController")' in race
          assert 'Get(__instance, "PlayableUnitStatsController")' not in race
          assert 'IsFromRace' in race and 'IsOurHero' in race
          assert 'GamePerks.NeedsPermanentSync(' in plugin
          print('Static integration invariants checked; runtime game smoke test still required')
          PY
      - name: Validate optional ModKit skills
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ids=set()
          for name in glob.glob('ModKit/Skills/*.patch.xml'):
              root=ET.parse(name).getroot()
              assert root.tag=='Patch' and root.attrib['target']=='SkillDefinition'
              assert root.attrib['action']=='add'
              inner=root.find('./Definition/SkillDefinition')
              assert inner is not None and inner.attrib['Id']==root.attrib['id']
              ids.add(inner.attrib['Id'])
          base={'EternalGhostShot','EternalEtherSlash','EternalArcanePulse',
                'EternalEchoHunter','EternalEchoMage','EternalSecondShot'}
          mastered={f'{name}{rank}' for name in ['EternalGhostShot','EternalEtherSlash','EternalArcanePulse']
                    for rank in ['III','V']}
          echoes={'EternalEchoHunterII','EternalEchoMageII','EternalSecondShotII'}
          expected=base | mastered | echoes | {'EternalTeleport'}
          assert ids==expected, (sorted(ids), sorted(expected-ids))
          tele=ET.parse('ModKit/Skills/eternal_teleport.patch.xml').getroot()
          assert tele.find('.//AreaOfEffect').text.strip()=='M'
          assert tele.find('.//Maneuver') is not None
          assert tele.find('.//Generic') is not None
          print('All 16 special skill XML patches are structurally valid')
          PY
      - name: Prepare installable artifact
        shell: bash
        run: |
          mkdir -p package/BepInEx/plugins/EternalHero/ModKit/Skills
          cp src/EternalHero.Plugin/bin/Release/netstandard2.0/EternalHero.Plugin.dll package/BepInEx/plugins/EternalHero/
          cp src/EternalHero.Core/bin/Release/netstandard2.0/EternalHero.Core.dll package/BepInEx/plugins/EternalHero/
          cp docs/INSTALL.md package/INSTALL.md
          cp ModKit/Skills/*.patch.xml package/BepInEx/plugins/EternalHero/ModKit/Skills/
          cp ModKit/languages.csv package/BepInEx/plugins/EternalHero/ModKit/
      - uses: actions/upload-artifact@v4
        with:
          name: EternalHero-v0.14
          path: package/
          if-no-files-found: error
