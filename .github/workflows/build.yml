name: Build Eternal Hero v0.6

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test progression and ascension engine
        run: dotnet run --project tests/EternalHero.Tests/EternalHero.Tests.csproj --configuration Release
      - name: Build BepInEx plugin
        run: dotnet build src/EternalHero.Plugin/EternalHero.Plugin.csproj --configuration Release
      - name: Validate optional ModKit skills
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ids=set()
          for name in glob.glob('ModKit/Skills/*.patch.xml'):
              root=ET.parse(name).getroot()
              assert root.tag=='Patch' and root.attrib['target']=='SkillDefinition'
              assert root.attrib['action']=='add'
              inner=root.find('./Definition/SkillDefinition')
              assert inner is not None and inner.attrib['Id']==root.attrib['id']
              ids.add(inner.attrib['Id'])
          assert ids=={'EternalGhostShot','EternalEtherSlash','EternalArcanePulse',
                        'EternalEchoHunter','EternalEchoMage','EternalSecondShot'}, ids
          print('All special skill XML patches are valid')
          PY
      - name: Package prototype DLLs
        shell: bash
        run: |
          mkdir -p package/BepInEx/plugins/EternalHero
          cp src/EternalHero.Plugin/bin/Release/netstandard2.0/EternalHero.Plugin.dll package/BepInEx/plugins/EternalHero/
          cp src/EternalHero.Core/bin/Release/netstandard2.0/EternalHero.Core.dll package/BepInEx/plugins/EternalHero/
          cp docs/INSTALL.md package/INSTALL.md
          mkdir -p package/BepInEx/plugins/EternalHero/ModKit/Skills
          cp ModKit/Skills/*.patch.xml package/BepInEx/plugins/EternalHero/ModKit/Skills/
          cp ModKit/languages.csv package/BepInEx/plugins/EternalHero/ModKit/
          cd package
          zip -r ../EternalHero-v0.6.zip BepInEx INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: EternalHero-v0.6
          path: EternalHero-v0.6.zip
          if-no-files-found: error
